name: print_widget_flutter
description: "Capture Flutter widgets and pages as PNG screenshots for visual verification. Designed for LLMs to generate, compare, and iterate on UI."
version: 0.1.0
repository: https://github.com/ulisseshen/print_widget
issue_tracker: https://github.com/ulisseshen/print_widget/issues
topics:
  - flutter
  - screenshot
  - testing
  - golden-test
  - widget

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  args: ^2.4.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

executables:
  print_widget: print_widget
