name: print_widget_flutter
description: "Capture Flutter widgets and pages as PNG screenshots for visual verification. Designed for LLMs to generate, compare, and iterate on UI."
version: 0.2.1
repository: https://github.com/ulisseshen/print_widget
homepage: https://github.com/ulisseshen/print_widget
issue_tracker: https://github.com/ulisseshen/print_widget/issues
topics:
  - flutter
  - screenshot
  - testing
  - golden-test
  - widget
screenshots:
  - description: "Login page captured on iPhone 15 Pro"
    path: doc/screenshots/login_page.png
  - description: "Home page captured on iPhone 15 Pro"
    path: doc/screenshots/home_page.png
  - description: "Product card widget screenshot"
    path: doc/screenshots/product_card.png
  - description: "Stats card widget screenshot"
    path: doc/screenshots/stats_card.png
funding:
  - https://github.com/sponsors/ulisseshen

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  args: ^2.4.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

executables:
  print_widget: print_widget
