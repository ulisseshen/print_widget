name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib/

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run package tests
        run: flutter test test/device_frame_test.dart test/match_device_suffix_test.dart test/cli_no_flutter_import_test.dart

      - name: Run example tests (update goldens — cross-platform rendering differs)
        working-directory: example
        run: flutter test --update-goldens
